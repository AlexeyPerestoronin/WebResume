<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Rust WASM Hello World</title>
</head>
<body>
    <script type="module">
        // Импортируем инициализатор и функцию из сгенерированного пакета
        import init, { greet } from './pkg/hello_wasm.js';

        async function run() {
            await init(); // Инициализируем WASM-модуль
            greet("WebAssembly"); // Вызываем нашу функцию на Rust
        }
        run();
    </script>
</body>
</html>
