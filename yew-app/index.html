<!DOCTYPE html>
<html>

<head>
    <script type="text/javascript">
        // this huck redirect URL to hash-routing or save path for SPA
        (function (l) {
            if (l.search[1] === '/') {
                var decoded = l.search.slice(1).split('&').map(function (s) {
                    return s.replace(/~and~/g, '&')
                }).join('?');
                window.history.replaceState(null, null,
                    l.pathname.slice(0, -1) + decoded + l.hash
                );
            }
        }(window.location))
    </script>

    <meta charset="utf-8" />
    <title>Yew App</title>
</head>

<body></body>

</html>
